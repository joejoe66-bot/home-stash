<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Home Stash</title>
<meta name="description" content="Home Stash 屋企寶庫 — household stock, expiry & shopping list">
<meta name="theme-color" content="#FFF7F0">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Home Stash">
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
:root{
  --bg:#FFF7F0; --card:#fff; --ink:#4A3B47; --muted:#9A8A95;
  --pink:#FF8FAB; --pink2:#FFE4EC; --mint:#7ED6B5; --mint2:#E3F7EF;
  --yellow:#FFD166; --yellow2:#FFF4D6; --red:#FF6B6B; --red2:#FFE3E3; --blue:#8EC5FF;
  --r:20px; --shadow:0 6px 18px rgba(255,143,171,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang HK","Noto Sans TC","Microsoft JhengHei",sans-serif}
body{padding-bottom:calc(100px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 12px calc(16px + env(safe-area-inset-left));background:rgba(255,247,240,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.brand{font-weight:800;font-size:20px}
.brand small{font-weight:600;font-size:12px;color:var(--muted);margin-left:4px}
.me{border:0;background:#fff;border-radius:999px;padding:8px 14px;font-weight:700;box-shadow:var(--shadow);font-size:14px;color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:0 calc(16px + env(safe-area-inset-right)) 0 calc(16px + env(safe-area-inset-left))}
.tab{display:none;animation:fade .25s}
.tab.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card h3{margin:0 0 10px;font-size:16px}
.empty{color:var(--muted);text-align:center;margin:8px 0}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,#FFE4EC,#FFF4D6)}
.ring{--p:100;width:92px;height:92px;border-radius:50%;flex:none;display:grid;place-items:center;
  background:conic-gradient(var(--pink) calc(var(--p)*1%),#fff 0)}
.ring span{width:72px;height:72px;border-radius:50%;background:#FFF7F0;display:grid;place-items:center;font-size:38px}
.big{font-size:34px;font-weight:900}.big small{font-size:14px;color:var(--muted)}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:#fff;border-radius:16px;padding:12px;text-align:center;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px}.stat span{font-size:12px;color:var(--muted)}
.lot{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #F3DDE4}
.lot:first-of-type{border-top:0}
.em{width:42px;height:42px;border-radius:14px;background:var(--pink2);display:grid;place-items:center;font-size:24px;flex:none;overflow:hidden}
.em img{width:100%;height:100%;object-fit:cover}
.info{flex:1;min-width:0}
.info b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--muted)}
.badge{font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;white-space:nowrap}
.b-red{background:var(--red2);color:#D63B3B}.b-org{background:#FFE8D6;color:#E07A2E}
.b-yel{background:var(--yellow2);color:#B8860B}.b-grn{background:var(--mint2);color:#2E9B73}.b-gry{background:#F1EEF0;color:var(--muted)}
.acts{display:flex;gap:6px}
.acts button{border:0;border-radius:12px;padding:8px 10px;font-weight:800;font-size:14px;min-width:46px;min-height:42px}
.use{background:var(--mint2);color:#2E9B73}.toss{background:#F6F1F3}
.btn{border:0;border-radius:16px;padding:12px 16px;font-weight:800;font-size:15px;background:#F6F1F3;color:var(--ink);
  display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer}
.btn.primary{background:var(--pink);color:#fff;box-shadow:0 6px 14px rgba(255,143,171,.45)}
.btn.mint{background:var(--mint);color:#fff}
.btn.ghost{background:transparent;border:2px dashed #F3C6D3;color:var(--pink)}
.btn.full{width:100%;margin-top:10px}
.btn:active,.acts button:active,.navbtn:active{transform:scale(.95)}
.row{display:flex;gap:8px;margin-top:10px}.row>*{flex:1}
input,select{width:100%;border:2px solid #F3DDE4;border-radius:14px;padding:11px 12px;font-size:16px;background:#fff;color:var(--ink);font-family:inherit}
input:focus{outline:none;border-color:var(--pink)}
label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid #F3DDE4;background:#fff;border-radius:999px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--ink)}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.chips.small .chip{padding:5px 10px;font-size:12px}
.scroll-chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}
.scroll-chips .chip{flex:none}
.group{padding:12px 16px}
.ghead{display:flex;align-items:center;gap:10px}
.ghead .info b{font-size:16px}
.total{font-weight:900;font-size:18px;color:var(--pink)}
.mini{border:0;background:var(--pink2);color:var(--pink);border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;min-height:36px;white-space:nowrap}
#reader{width:100%;border-radius:16px;overflow:hidden;background:#2b2230;min-height:0}
#reader video{border-radius:16px}
.scanbox{text-align:center;padding:26px 10px}
.scanbox .bigicon{font-size:64px;animation:bob 2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.tip{font-size:12px;color:var(--muted);line-height:1.6}
.shopitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px dashed #F3DDE4}
.shopitem:first-child{border-top:0}
.check{width:28px;height:28px;border-radius:10px;border:2px solid var(--pink);display:grid;place-items:center;flex:none;font-size:16px;background:#fff}
.done .check{background:var(--mint);border-color:var(--mint);color:#fff}
.done .info b{text-decoration:line-through;color:var(--muted)}
.rank{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px dashed #F3DDE4}
.rank:first-child{border-top:0}
.medal{font-size:26px;width:34px;text-align:center}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--yellow2);display:grid;place-items:center;font-size:26px}
.bar{height:8px;border-radius:9px;background:#F6F1F3;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow))}
.pts{font-weight:900;font-size:18px;color:var(--pink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:space-around;align-items:flex-end;
  background:#fff;padding:8px 6px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 20px rgba(0,0,0,.06);border-radius:24px 24px 0 0}
.navbtn{border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:var(--muted);gap:2px;padding:4px 8px;position:relative}
.navbtn .i{font-size:22px}
.navbtn.on{color:var(--pink)}
.navbtn .dot{position:absolute;top:0;right:6px;background:var(--red);color:#fff;border-radius:999px;font-size:10px;padding:1px 5px}
.scanfab{width:64px;height:64px;border-radius:50%;background:var(--pink);color:#fff;font-size:28px;display:grid;place-items:center;
  margin-top:-34px;box-shadow:0 8px 20px rgba(255,143,171,.55);border:5px solid var(--bg)}
.overlay{position:fixed;inset:0;z-index:50;background:rgba(74,59,71,.45);display:flex;align-items:flex-end;justify-content:center}
.overlay.center{align-items:center}
.hidden{display:none!important}
.sheet-body{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:28px 28px 0 0;padding:18px 16px calc(30px + env(safe-area-inset-bottom));animation:up .28s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet-head{display:flex;gap:12px;align-items:center}
.sheet-head h2{margin:4px 0;font-size:20px}
.big-em{width:72px;height:72px;border-radius:20px;background:#fff;display:grid;place-items:center;font-size:42px;overflow:hidden;flex:none;box-shadow:var(--shadow)}
.big-em img{width:100%;height:100%;object-fit:contain}
.x{margin-left:auto;align-self:flex-start;border:0;background:#fff;border-radius:50%;width:36px;height:36px;font-size:16px;box-shadow:var(--shadow)}
.pill{display:inline-block;font-size:11px;font-weight:800;background:var(--mint2);color:#2E9B73;padding:3px 9px;border-radius:999px}
.have{background:var(--yellow2);border-radius:14px;padding:10px 12px;margin:14px 0 4px;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;gap:6px}
.stepper button{border:0;background:var(--pink2);color:var(--pink);border-radius:12px;width:44px;font-size:22px;font-weight:900}
.stepper input{text-align:center}
.picker{background:var(--bg);border-radius:28px;padding:22px;width:calc(100% - 32px);max-width:420px;text-align:center;animation:up .3s}
.picker h2{margin:6px 0 2px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.who button{border:0;background:#fff;border-radius:18px;padding:14px 6px;font-weight:800;box-shadow:var(--shadow);font-size:13px;color:var(--ink)}
.who button span{display:block;font-size:34px;margin-bottom:4px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);opacity:0;z-index:80;
  background:var(--ink);color:#fff;padding:12px 18px;border-radius:999px;font-weight:700;font-size:14px;transition:.3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#busy{position:fixed;top:0;left:0;height:4px;width:0;z-index:90;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--mint));transition:width .4s}
#busy.on{width:85%}
.pop{position:fixed;z-index:85;font-size:28px;pointer-events:none;animation:fly 1.1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),-260px) rotate(var(--rot));opacity:0}}
.splash{position:fixed;inset:0;z-index:100;background:var(--bg);display:grid;place-items:center;text-align:center;transition:opacity .4s}
.splash .bigicon{font-size:80px;animation:bob 1.2s ease-in-out infinite}
.logline{font-size:13px;padding:6px 0;border-top:1px dashed #F3DDE4}
.logline:first-child{border-top:0}
.logline small{color:var(--muted)}
.spin{font-size:46px;animation:bob 1s infinite}
.center{text-align:center}
.lot.sub{padding:8px 0 8px 8px}
.lot.sub .info b{font-size:14px;font-weight:700;white-space:normal}
@media (max-width:420px){.ptsS{display:none}.brand{font-size:18px}header .me{padding:8px 10px}.hbtns{gap:6px}header{padding-left:calc(12px + env(safe-area-inset-left));padding-right:calc(12px + env(safe-area-inset-right))}}
#pinBox input{text-align:center;font-size:22px;letter-spacing:6px;margin:14px 0 4px}
#pinErr{color:#D63B3B;font-size:13px;min-height:18px}
@media (min-width:760px){
  main{max-width:1060px;padding-left:24px;padding-right:24px}
  header{padding-left:max(24px,calc((100% - 1060px)/2 + 24px));padding-right:max(24px,calc((100% - 1060px)/2 + 24px))}
  #tab-home.active,#tab-rank.active,#tab-scan.active{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:start}
  #tab-home.active>*,#tab-rank.active>*,#tab-scan.active>*,#stockList>*{min-width:0}
  #tab-home .hero,#tab-home .stats,#tab-home>.btn{grid-column:1/-1}
  #tab-home .stats{margin:2px 0 4px}
  #stockList{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 18px;align-items:start}
  #tab-shop .card{max-width:680px;margin-left:auto;margin-right:auto}
  #tab-shop>.tip{max-width:680px;margin:0 auto}
  .overlay{align-items:center}
  .sheet-body{max-width:640px;border-radius:28px;max-height:88vh;padding-bottom:24px}
  nav{left:50%;right:auto;transform:translateX(-50%);width:min(680px,92%);bottom:14px;border-radius:28px;padding-bottom:10px;box-shadow:0 10px 30px rgba(74,59,71,.15)}
  body{padding-bottom:120px}
  .pgrid{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
  .who{grid-template-columns:repeat(auto-fill,minmax(110px,1fr))}
}
@media (min-width:1100px){
  #stockList{grid-template-columns:repeat(3,minmax(0,1fr))}
}
#loader{position:fixed;inset:0;z-index:95;background:rgba(255,247,240,.55);backdrop-filter:blur(2px);display:none;place-items:center}
#loader.on{display:grid}
#loader .ld{background:#fff;border-radius:24px;padding:22px 30px;box-shadow:var(--shadow);text-align:center;font-weight:800}
#loader .sp{width:46px;height:46px;border-radius:50%;border:5px solid var(--pink2);border-top-color:var(--pink);animation:spin .8s linear infinite;margin:0 auto 10px}
@keyframes spin{to{transform:rotate(360deg)}}
.spinning span{display:inline-block;animation:spin .8s linear infinite}
details.card>summary{font-weight:800;font-size:16px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:'▾';color:var(--pink);transition:transform .2s}
details.card[open]>summary::after{transform:rotate(180deg)}
details.card[open]>summary{margin-bottom:10px}
.howto{background:var(--mint2);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.7;margin-top:12px}
.hbtns{display:flex;gap:8px;align-items:center;flex:none}
.me{white-space:nowrap}
.lang{padding:8px 12px}
.brand{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
@media (max-width:480px){.brand small{display:none}}
.picker .lang{margin-top:4px}
.btn.wa{background:#25D366;color:#fff;box-shadow:0 6px 14px rgba(37,211,102,.35)}
.btn.big{font-size:17px;padding:14px 16px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.ptile{border:0;background:#fff;border-radius:16px;padding:8px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--ink);font-family:inherit}
.ptile b{font-size:12px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ptile span{font-size:11px;color:var(--pink);font-weight:800}
.pimg{width:72px;height:72px;border-radius:14px;background:var(--pink2);display:grid;place-items:center;font-size:36px;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<div id="busy"></div>
<div id="loader"><div class="ld"><div class="sp"></div><div id="loaderTxt">…</div></div></div>
<div class="splash" id="splash"><div><div class="bigicon">🏠</div><h2 data-t="brand">Home Stash</h2><p class="sub" data-t="loading">Tidying up…</p></div></div>

<header>
  <div class="brand"><span data-t="brandIcon">🏠 Home Stash</span><small data-t="brandSub"></small></div>
  <div class="hbtns">
    <button class="me lang" id="refBtn" onclick="refresh()" aria-label="Refresh"><span>🔄</span></button>
    <button class="me lang" id="langBtn" onclick="toggleLang()">中文</button>
    <button class="me" id="meBtn" onclick="showPicker()">🙂</button>
  </div>
</header>

<main>
  <section id="tab-home" class="tab active"></section>

  <section id="tab-stock" class="tab">
    <div class="card" style="padding:12px">
      <input id="q" data-tp="search" oninput="S.q=this.value.toLowerCase();renderStock()">
      <div class="chips scroll-chips" id="locChips" style="margin-top:10px"></div>
    </div>
    <div id="stockList"></div>
  </section>

  <section id="tab-scan" class="tab">
    <div class="card">
      <div id="readerFile" style="position:absolute;left:-9999px;top:0;width:300px;height:300px;overflow:hidden"></div>
      <div class="scanbox" id="scanIdle">
        <div class="bigicon">📦</div>
        <h3 data-t="scanTitle"></h3>
        <p class="tip" data-t="scanTip"></p>
      </div>
      <label class="btn primary full big" style="margin:0"><span data-t="photo"></span>
        <input type="file" accept="image/*" capture="environment" onchange="scanPhoto(this)" hidden></label>
      <div class="row">
        <input id="manualCode" inputmode="numeric" data-tp="typeCode" onkeydown="if(event.key==='Enter')manualLookup()">
        <button class="btn" style="flex:none" onclick="manualLookup()">🔍</button>
      </div>
      <button class="btn ghost full" onclick="openManual()" data-t="noBarcode"></button>
      <p class="tip" data-t="scanHelp"></p>
    </div>
    <div class="card" id="photoCard">
      <h3 data-t="photoGridTitle"></h3>
      <p class="tip" style="margin-top:-4px" data-t="photoGridTip"></p>
      <div class="pgrid" id="photoGrid"></div>
    </div>
  </section>

  <section id="tab-shop" class="tab">
    <div class="card">
      <h3 data-t="shopTitle"></h3>
      <div class="row" style="margin-top:0">
        <input id="shopInput" data-tp="shopPh" onkeydown="if(event.key==='Enter')addShop()">
        <button class="btn primary" style="flex:none" onclick="addShop()">＋</button>
      </div>
      <div class="howto" id="shopHow"></div>
      <div id="shopList" style="margin-top:8px"></div>
      <button class="btn ghost full" onclick="clearBought()" data-t="clearBought"></button>
      <button class="btn wa full" onclick="shareWA()" data-t="waShare"></button>
    </div>
    <p class="tip center" data-t="shopTip"></p>
  </section>

  <section id="tab-rank" class="tab"></section>
</main>

<nav>
  <button class="navbtn on" data-tab="home" onclick="go('home')"><span class="i">🏡</span><span data-t="navHome"></span></button>
  <button class="navbtn" data-tab="stock" onclick="go('stock')"><span class="i">📦</span><span data-t="navStock"></span></button>
  <button class="navbtn" data-tab="scan" onclick="go('scan')"><span class="scanfab">📷</span><span data-t="navScan"></span></button>
  <button class="navbtn" data-tab="shop" onclick="go('shop')"><span class="i">🛒</span><span data-t="navShop"></span><span class="dot hidden" id="shopDot"></span></button>
  <button class="navbtn" data-tab="rank" onclick="go('rank')"><span class="i">🏆</span><span data-t="navRank"></span></button>
</nav>

<div class="overlay hidden" id="sheet" onclick="if(event.target===this)closeSheet()"><div class="sheet-body" id="sheetBody"></div></div>
<div class="overlay center hidden" id="picker"><div class="picker" id="pickerBody"></div></div>
<div id="toast"></div>

<script>
/* ===== 語言 Language ===== */
const L={
 zh:{brandIcon:'🏠 屋企寶庫',brandSub:'Home Stash',brand:'屋企寶庫',loading:'執緊屋企啲嘢…',who:'🙂 揀人',search:'🔎 搵嘢…',

function applyStatic(){
  document.documentElement.lang=LANG==='en'?'en':'zh-HK';

  document.querySelectorAll('[data-tp]').forEach(el=>el.placeholder=t(el.dataset.tp));

  document.title=t('brand');

}
function toggleLang(){LANG=LANG==='en'?'zh':'en';ls('hs_lang',LANG);applyStatic();if(S.data)renderAll();if(!document.getElementById('picker').classList.contains('hidden'))showPicker();}

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function jsq(s){return esc(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");}
const API='https://script.google.com/macros/s/AKfycby7VJylcc9bKbSDPOkP2B26-vP87b17JnRHXk0yOs_l3JfB0o3m_71GrAZFiHP81XfC/exec';
class PinError extends Error{}
async function run(fn,...args){
  const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},cache:'no-store',
    body:JSON.stringify({fn,args,pin:ls('hs_pin')||''})});
  const j=await r.json();
  if(!j.ok){
    if(/^(BADPIN|NOPIN|LOCKED)$/.test(j.err))throw new PinError(j.err);
    throw new Error(j.err||'Server error');
  }
  if(fn==='getData'||(j.data&&j.data.stock))cacheData(j.data);
  return j.data;
}
function cacheData(d){try{localStorage.setItem('hs_cache',JSON.stringify(d));}catch(e){}}
function cachedData(){try{return JSON.parse(localStorage.getItem('hs_cache')||'null');}catch(e){return null;}}
function askPin(err){
  return new Promise(res=>{
    const msg=err==='NOPIN'?t('pinNotSet'):err==='LOCKED'?t('tooMany'):err==='BADPIN'?t('pinWrong'):'';
    document.getElementById('pickerBody').innerHTML=`<div id="pinBox"><div style="font-size:46px">🏠</div><h2>${t('pinTitle')}</h2><div class="sub">${t('pinSub')}</div>
      <input id="pinIn" type="password" inputmode="numeric" autocomplete="off" maxlength="20">
      <div id="pinErr">${msg}</div>
      <button class="btn primary full" id="pinGo">${t('pinOk')}</button>
      <button class="me lang" style="margin-top:12px" onclick="toggleLang();askPin.again()">${LANG==='en'?'中文':'English'}</button></div>`;
    document.getElementById('picker').classList.remove('hidden');
    const sp=document.getElementById('splash');if(sp)sp.style.display='none';
    const go=()=>{const v=document.getElementById('pinIn').value.trim();if(!v)return;ls('hs_pin',v);document.getElementById('picker').classList.add('hidden');res();};
    document.getElementById('pinGo').onclick=go;
    document.getElementById('pinIn').onkeydown=e=>{if(e.key==='Enter')go();};
    askPin.again=()=>askPin(err).then(res);
    setTimeout(()=>document.getElementById('pinIn').focus(),100);
  });
}
async function call(fn,...a){
  busy(true);
  try{const d=await run(fn,...a);if(d&&d.stock){S.data=d;lastLoad=Date.now();renderAll();}return d;}
  catch(e){if(e instanceof PinError){busy(false);await askPin(e.message);return call(fn,...a);}toast('😵 '+(e.message||e));throw e;}
  finally{busy(false);}
}
let busyN=0;
function busy(on){busyN=Math.max(0,busyN+(on?1:-1));const v=busyN>0;document.getElementById('busy').classList.toggle('on',v);document.getElementById('loaderTxt').textContent=t('saving');document.getElementById('loader').classList.toggle('on',v);}
function toast(m){const el=document.getElementById('toast');el.textContent=m;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2200);}
function pop(emoji,n=12){
  for(let i=0;i<n;i++){const s=document.createElement('span');s.className='pop';s.textContent=Array.isArray(emoji)?emoji[i%emoji.length]:emoji;
    s.style.left=(window.innerWidth/2-14)+'px';s.style.top=(window.innerHeight-160)+'px';
    s.style.setProperty('--dx',(Math.random()*260-130)+'px');s.style.setProperty('--rot',(Math.random()*360-180)+'deg');
    s.style.animationDelay=(i*0.04)+'s';document.body.appendChild(s);setTimeout(()=>s.remove(),1500);}
}
function beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();const o=c.createOscillator(),g=c.createGain();o.frequency.value=1200;o.connect(g);g.connect(c.destination);g.gain.value=.15;o.start();o.stop(c.currentTime+.12);}catch(e){}if(navigator.vibrate)navigator.vibrate(60);}
const catEmoji=c=>(CATS.find(x=>x[0]===c)||['', '📦'])[1];
const locEmoji=l=>(LOCS.find(x=>x[0]===l)||['','🏷️'])[1];
function badge(d){
  if(d===null||d===undefined)return `<span class="badge b-gry">${t('bNoExp')}</span>`;
  if(d<0)return `<span class="badge b-red">${t('bExpired',-d)}</span>`;
  if(d===0)return `<span class="badge b-red">${t('bToday')}</span>`;
  if(d<=3)return `<span class="badge b-org">${t('bDays',d)}</span>`;
  if(d<=14)return `<span class="badge b-yel">${t('bDays',d)}</span>`;
  return `<span class="badge b-grn">${t('bDays',d)}</span>`;
}
function thumb(s){return s.image?`<img src="${esc(s.image)}" onerror="this.replaceWith(document.createTextNode('${s.emoji}'))">`:s.emoji;}

function renderPhotoGrid(){
  const items=S.data.items.filter(i=>!i.barcode);
  const totals={};S.data.stock.forEach(s=>totals[s.key]=(totals[s.key]||0)+s.qty);
  document.getElementById('photoGrid').innerHTML=items.length?items.map(i=>{const k='N:'+i.name;
    return `<button class="ptile" onclick="openKey('${jsq(k)}')"><div class="pimg">${i.image?`<img src="${esc(i.image)}">`:i.emoji}</div>
      <b>${esc(i.name)}</b><span>×${totals[k]||0}</span></button>`;}).join('')
    :`<p class="empty" style="grid-column:1/-1">${t('photoGridEmpty')}</p>`;
}

/* 影相：縮細做 200px 細圖，直接存入 Sheet（唔使額外權限） */
function takePhoto(input){
  const f=input.files[0];if(!f)return;
  const img=new Image(),url=URL.createObjectURL(f);
  img.onload=()=>{
    const max=200,r=Math.min(1,max/Math.max(img.width,img.height));
    const c=document.createElement('canvas');c.width=Math.round(img.width*r);c.height=Math.round(img.height*r);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    let q=0.75,data=c.toDataURL('image/jpeg',q);
    while(data.length>40000&&q>0.3){q-=0.15;data=c.toDataURL('image/jpeg',q);}
    URL.revokeObjectURL(url);
    const fm=document.getElementById('f');fm.image.value=data;
    document.getElementById('bigEm').innerHTML=`<img src="${data}">`;
    document.getElementById('photoBtnTxt').textContent=t('changePhoto');
    toast(t('photoSaved'));
  };
  img.src=url;input.value='';
}

/* WhatsApp：打開 WhatsApp 並寫好訊息，自己揀群組 send */
function waText(){
  const d=S.data,lines=[t('waHead',d.today)];
  if(d.expiring.length){lines.push('',t('waExp'));d.expiring.forEach(s=>lines.push(`• ${s.emoji} ${s.name} ×${s.qty} (${nm(s.location)}) — ${t('waLeft',s.daysLeft)}`));}
  if(d.low.length){lines.push('',t('waLow'));d.low.forEach(i=>lines.push(`• ${i.emoji} ${i.name}: ${i.have}/${i.minQty}`));}
  const todo=d.shop.filter(x=>!x.done);
  if(todo.length){lines.push('',t('waShop'));todo.forEach(x=>lines.push(`☐ ${x.name}`));}
  if(lines.length===1)lines.push('',t('waNone'));
  return lines.join('\n');
}
function shareWA(){
  const a=document.createElement('a');a.href='https://wa.me/?text='+encodeURIComponent(waText());
  a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove();
}

const FORMATS=()=>[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,
  Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.QR_CODE];
let qr=null;
function loadImg(f){return new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=rej;i.src=u;});}
// 將相片整成幾個版本：縮細、裁中間、轉 90 度、加強對比
function variants(img){
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,out=[];
  const mk=(sx,sy,sw,sh,max,rot,contrast)=>{
    const r=Math.min(1,max/Math.max(sw,sh)),w=Math.round(sw*r),h=Math.round(sh*r);
    const c=document.createElement('canvas');c.width=rot?h:w;c.height=rot?w:h;const x=c.getContext('2d');
    if(contrast)x.filter='grayscale(1) contrast(1.8)';
    if(rot){x.translate(h,0);x.rotate(Math.PI/2);}
    x.drawImage(img,sx,sy,sw,sh,0,0,w,h);return c;};
  out.push(mk(0,0,W,H,1400));
  out.push(mk(W*.15,H*.25,W*.7,H*.5,1200));          // 中間
  out.push(mk(0,0,W,H,900));
  out.push(mk(W*.15,H*.25,W*.7,H*.5,1200,false,true)); // 中間 + 對比
  out.push(mk(W*.3,H*.38,W*.4,H*.24,1600));           // 拉近中間（影得太遠）
  out.push(mk(W*.3,H*.38,W*.4,H*.24,1600,false,true));
  out.push(mk(W*.25,H*.15,W*.5,H*.7,1200,true));      // 直嘅條碼
  out.push(mk(0,0,W,H,1400,true));
  out.push(mk(0,0,W,H,600));
  return out;
}
const toFile=c=>new Promise(r=>c.toBlob(b=>r(new File([b],'scan.jpg',{type:'image/jpeg'})),'image/jpeg',0.92));
async function decodeLocal(img){
  const vs=variants(img);
  if('BarcodeDetector' in window){
    try{const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      for(const c of vs){const r=await det.detect(c);if(r&&r.length)return r[0].rawValue;}}catch(e){}
  }
  if(typeof Html5Qrcode==='undefined')return '';
  try{if(!qr)qr=new Html5Qrcode('readerFile',{formatsToSupport:FORMATS(),verbose:false});}catch(e){return '';}
  for(const c of vs){try{const code=await qr.scanFile(await toFile(c),false);if(code)return code;}catch(e){}}
  return '';
}
function shrink(img,max,q){
  const W=img.naturalWidth||img.width,H=img.naturalHeight||img.height,r=Math.min(1,max/Math.max(W,H));
  const c=document.createElement('canvas');c.width=Math.round(W*r);c.height=Math.round(H*r);
  c.getContext('2d').drawImage(img,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q);
}
const busyMsg=m=>openSheet(`<div class="center" style="padding:40px 0"><div class="spin">🔍</div><p>${m}</p></div>`);
async function scanPhoto(input){
  if(!needMe())return;const f=input.files[0];input.value='';if(!f)return;
  busyMsg(t('reading'));
  let img;try{img=await loadImg(f);}catch(e){closeSheet();toast(t('photoFail'));return;}
  const code=await decodeLocal(img);
  if(code){beep();openItem(code);return;}
  if(!S.data.ai){closeSheet();toast(t('aiOff'));return;}
  busyMsg(t('aiReading'));
  let r;
  try{r=await run('readPhoto',shrink(img,1280,0.85).split(',')[1]);}catch(e){r={error:'ai'};}
  if(!r||r.error){closeSheet();toast(r&&r.error==='nokey'?t('aiOff'):t('aiErr'));return;}
  const thumb=shrink(img,200,0.7);
  if(r.barcode){
    beep();busyMsg(t('lookingUp'));
    let info;try{info=await run('lookupBarcode',r.barcode);}catch(e){info={source:'new',barcode:r.barcode};}
    if(info.source==='new'){Object.assign(info,{source:'ai',name:r.name,brand:r.brand,category:r.category,emoji:catEmoji(r.category),image:thumb});}
    renderItemSheet(info);return;
  }
  if(r.name){
    beep();
    const low=r.name.toLowerCase();
    const hit=S.data.items.find(i=>!i.barcode&&(i.name.toLowerCase()===low||low.includes(i.name.toLowerCase())||i.name.toLowerCase().includes(low)));
    if(hit){renderItemSheet(Object.assign({source:'mine'},hit));return;}
    renderItemSheet({source:'ai',barcode:'',name:r.name,brand:r.brand,category:r.category,emoji:catEmoji(r.category),image:thumb});return;
  }
  closeSheet();toast(t('photoFail'));
}

let lastLoad=Date.now(),refreshing=false;
async function refresh(silent){
  if(refreshing)return;refreshing=true;const b=document.getElementById('refBtn');b.classList.add('spinning');
  try{const d=await run('getData');S.data=d;lastLoad=Date.now();renderAll();if(!silent)toast(t('refreshed'));}
  catch(e){if(e instanceof PinError){await askPin(e.message);refreshing=false;b.classList.remove('spinning');return refresh(silent);}if(!silent)toast(navigator.onLine===false?t('offline'):'😵 '+(e.message||e));}
  finally{refreshing=false;b.classList.remove('spinning');}
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&S.data&&Date.now()-lastLoad>30000&&document.getElementById('sheet').classList.contains('hidden'))refresh(true);
});

if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
(async function init(){
  const hideSplash=()=>{const sp=document.getElementById('splash');if(sp){sp.style.opacity=0;setTimeout(()=>sp.remove(),400);}};
  // 秘密連結：…/home-stash/#k=暗號 → 記低，再喺網址清走
  const km=location.hash.match(/[#&]k=([^&]+)/);
  if(km){ls('hs_pin',decodeURIComponent(km[1]));history.replaceState(null,'',location.pathname+location.search);}
  if(!ls('hs_pin'))await askPin('');
  const c=ls('hs_pin')&&cachedData();
  if(c){S.data=c;renderAll();hideSplash();}
  for(;;){
    try{S.data=await run('getData');lastLoad=Date.now();renderAll();break;}
    catch(e){
      if(e instanceof PinError){await askPin(e.message);continue;}
      if(c){toast(t('offline'));break;}
      document.getElementById('splash').style.display='';
      document.getElementById('splash').innerHTML='<div><div class="bigicon">😵</div><h3>'+t('loadFail')+'</h3><p class="sub">'+esc(e.message||e)+'</p><button class="btn primary" onclick="location.reload()">↻</button></div>';return;
    }
  }
  hideSplash();
  if(!S.me||!S.data.members.some(m=>m.name===S.me))showPicker();
})();
</script>
</body>
</html>
